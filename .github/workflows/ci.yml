# Runs both halves' test suites on every push and PR. This is verification only — releases are cut
# by a human running publish.sh, on purpose (ADR-0011, ADR-0018).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    name: server (npm test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm test

  client:
    name: client (dotnet test)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test --nologo
